<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lab Task 10 — Layered Elements (z-index)</title>
  <style>
    /* Page layout */
    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #f2f6fb;
      margin: 0;
      padding: 32px;
      color: #222;
    }

    .wrap {
      position: relative;
      width: 720px;
      height: 320px;
      margin: 0 auto;
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #eef6ff 100%);
      box-shadow: 0 6px 18px rgba(20,40,80,0.08);
      padding: 18px;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
    }

    p.note {
      margin: 6px 0 16px 0;
      font-size: 13px;
      color: #555;
    }

    /* The three boxes */
    .box {
      position: absolute; /* requirement */
      width: 220px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 20px;
      border-radius: 6px;
      box-shadow: 0 8px 16px rgba(16,24,40,0.12);
      transition: transform 200ms ease, box-shadow 200ms ease;
      cursor: default;
    }

    .box:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 30px rgba(16,24,40,0.16);
    }

    /* initial positions (partially overlapping) */
    #box1 { /* red */
      background: #e03131;
      top: 40px;
      left: 40px;
      z-index: 1; /* default */
    }

    #box2 { /* blue */
      background: #1971c2;
      top: 80px;
      left: 160px;
      z-index: 2; /* default */
    }

    #box3 { /* green */
      background: #2f9e44;
      top: 120px;
      left: 280px;
      z-index: 3; /* default */
    }

    /* controls */
    .controls {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.06);
      background: #fff;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(16,24,40,0.04);
    }
    button:active { transform: translateY(1px); }

    .small { font-size: 13px; padding: 6px 10px; }

    .info {
      font-size: 13px;
      color: #444;
      margin-left: 6px;
    }

    /* show current z-index values */
    .z-display {
      margin-left: auto;
      font-size: 13px;
      color: #333;
      background: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 4px 8px rgba(16,24,40,0.04);
    }

    @media (max-width: 780px) {
      .wrap { width: 96%; }
    }
  </style>
</head>
<body>
  <div class="wrap" role="main">
    <h1>Lab Task 10 — Layered Elements (z-index)</h1>
    <p class="note">3 overlapping boxes (position:absolute). Click the buttons to swap z-index values and watch layering change.</p>

    <!-- boxes -->
    <div id="box1" class="box">Box 1</div>
    <div id="box2" class="box">Box 2</div>
    <div id="box3" class="box">Box 3</div>

    <!-- controls -->
    <div class="controls" aria-hidden="false" style="position: absolute; bottom: 14px; left: 14px; right: 14px;">
      <button id="resetBtn" class="small">Reset (1,2,3)</button>
      <button id="swap123" class="small">Bring Box 1 to Top</button>
      <button id="swap231" class="small">Bring Box 2 to Top</button>
      <button id="swap312" class="small">Bring Box 3 to Top</button>

      <div class="z-display" id="zvals">z: Box1=1 ▪ Box2=2 ▪ Box3=3</div>
    </div>
  </div>

  <script>
    // Simple helper to set z-indexes and update display
    const b1 = document.getElementById('box1');
    const b2 = document.getElementById('box2');
    const b3 = document.getElementById('box3');
    const zvals = document.getElementById('zvals');

    function setZ(z1, z2, z3) {
      b1.style.zIndex = z1;
      b2.style.zIndex = z2;
      b3.style.zIndex = z3;
      zvals.textContent = `z: Box1=${z1} ▪ Box2=${z2} ▪ Box3=${z3}`;
    }

    // default
    setZ(1,2,3);

    // controls
    document.getElementById('resetBtn').addEventListener('click', () => setZ(1,2,3));
    document.getElementById('swap123').addEventListener('click', () => setZ(3,1,2)); // 1 on top
    document.getElementById('swap231').addEventListener('click', () => setZ(2,3,1)); // 2 on top
    document.getElementById('swap312').addEventListener('click', () => setZ(1,2,4)); // 3 on top (use 4 to ensure it's highest)

    // Tip: you can also open devtools and edit the CSS z-index values directly to experiment.
  </script>
</body>
</html>
