        <h2>Sufian Showrov</h2>

        <p><strong>ID:</strong> 22-48735-3</p>

        <p class="bio">
            Hi, I am Sufian Showrov. I love learning web technologies and building simple websites.
        </p>
    </div>

    <footer>
        <p>© 2025 AIUB - Web Technologies</p>
    </footer>
